    # Private Chrome/VNC on this VPS. Both files and websocket require a session.
    location = /_genai_desktop_auth {
        internal;
        proxy_pass http://127.0.0.1:6083/vps-console/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }
    location ^~ /vps-console/ {
        proxy_pass http://127.0.0.1:6083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        proxy_read_timeout 60s;
    }
    location = /vps-desktop/websockify {
        auth_request /_genai_desktop_auth;
        proxy_pass http://127.0.0.1:6082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /vps-desktop/ {
        auth_request /_genai_desktop_auth;
        alias /usr/share/novnc/;
        add_header Cache-Control "no-store" always;
    }
