
server {
    listen 80;
    server_name admake.vn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admake.vn;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/admake.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admake.vn/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=15768000" always;

    # ssl_stapling on;
    # ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/admake.vn/chain.pem;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    location /.well-known/acme-challenge/ {
        root /var/www/admake.vn/html;
        allow all;
    }

    # Legacy lead admin URL
    location = /admin/leads {
        return 302 /lead-manage/;
    }

    location /admin/leads/ {
        return 302 /lead-manage/;
    }

    # Landing page
    location / {
        root /var/www/admake-landing-page;
        index index.html;
        try_files $uri /index.html;
    }


    # Admake private desktop. Every HTTP and websocket handshake checks admin session.
    location = /_admake_genai_auth {
        internal;
        proxy_pass http://127.0.0.1:6000/lead-manage/genai/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }
    location = /_admake_genai_api_auth {
        internal;
        proxy_pass http://127.0.0.1:6000/lead-manage/genai/api-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location /genai/api/ {
        auth_request /_admake_genai_api_auth;
        proxy_pass http://127.0.0.1:6002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
    location /genai/desktop/websockify {
        auth_request /_admake_genai_auth;
        proxy_pass http://127.0.0.1:6082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /genai/desktop/ {
        auth_request /_admake_genai_auth;
        alias /usr/share/novnc/;
        add_header Cache-Control "no-store" always;
    }
    location /genai/images/ {
        alias /var/lib/admake-genai/images/;
        add_header Access-Control-Allow-Origin "https://quanly.admake.vn";
    }

    # Lead management (merged into main-be)
    location /lead-manage/ {
        proxy_pass http://127.0.0.1:6000/lead-manage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets from main-be
    location /static/ {
        proxy_pass http://127.0.0.1:6000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:6000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Websocket
    location /socket.io/ {
        proxy_pass http://127.0.0.1:6000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
