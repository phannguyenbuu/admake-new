<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sản phẩm</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fb;color:#243244;font:13px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:white;border:1px solid #d8e0e7;border-radius:7px;padding:8px 12px;color:inherit}button:hover{border-color:#0d9488}button.primary{background:#0f766e;border-color:#0f766e;color:white}button:disabled{opacity:.45;cursor:default}input,select{border:1px solid #d8e0e7;border-radius:6px;padding:7px;background:white;max-width:100%}input[type=number]{width:90px}input[type=checkbox]{width:auto}h2{font-size:17px;margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;background:white;border-bottom:1px solid #e2e8f0}.layout{display:grid;grid-template-columns:255px 1fr;gap:16px;padding:16px}.sidebar,.editor{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:14px;min-width:0}.sidebar{height:calc(100vh - 105px);overflow:auto}.search{width:100%;margin-bottom:10px}.product{display:flex;align-items:center;gap:8px;padding:8px;width:100%;text-align:left;border-color:transparent}.product.active{background:#edf8f6;border-color:#99d5cc}.product img{width:45px;height:45px;object-fit:contain;background:#f8fafc;border-radius:4px}.muted{font-size:11px;color:#8090a3}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.fields{display:grid;grid-template-columns:2fr 1fr;gap:12px}.fields label{display:flex;flex-direction:column;gap:5px}.tools{justify-content:space-between;margin:18px 0 8px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{font-size:11px;color:#718096;font-weight:500;text-align:left;background:#f8fafc}td,th{padding:6px;border-bottom:1px solid #edf1f5}td input,td select{width:100%}td input.formula{min-width:220px;font-family:monospace}td select.item{min-width:230px}td .manual-name{min-width:180px}td.price{white-space:nowrap}small{font-size:11px;color:#718096}.status{padding:10px 16px;display:none}.status.error{display:block;background:#fff1f0;color:#b42318}.status.ok{display:block;background:#eaf8f1;color:#18794e}.preview{margin-top:16px;padding:14px;border:1px solid #d8e0e7;border-radius:9px}.preview table td:last-child{text-align:right}.pill{font-size:11px;background:#fff3d6;color:#95610a;padding:3px 7px;border-radius:5px}.pill.published{background:#e7f8ed;color:#18794e}dialog{border:1px solid #d8e0e7;border-radius:12px;padding:22px;width:480px;max-width:95vw}dialog::backdrop{background:#16223566}.confirm-actions{justify-content:flex-end;margin-top:20px}.hero{display:flex;gap:12px;margin-bottom:16px}.hero img{width:110px;height:100px;object-fit:contain;background:#f8fafc;border-radius:8px}.hero .fields{flex:1}.danger{color:#b42318}.empty{padding:45px;text-align:center;color:#718096}#access{display:none;padding:20px}.formula-help{margin:8px 0;color:#718096;font-size:11px}@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{height:200px}.fields{grid-template-columns:1fr}.hero img{width:75px}header{flex-wrap:wrap}}

.layout{grid-template-columns:235px minmax(300px,1fr) 355px;align-items:start;gap:12px;padding:14px}
.sidebar,.gallery,.editor{height:calc(100vh - 105px);overflow:auto}
.gallery{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:14px;min-width:0}
.gallery-heading{margin-bottom:14px}.gallery-heading h2{font-size:16px;margin-bottom:5px}
.image-card{margin:0;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;background:#f8fafc}
.image-card figcaption{padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:12px;font-weight:600;background:#fff}
.image-card a{display:flex;align-items:center;justify-content:center;padding:10px}
.image-card img{display:block;width:100%;height:220px;object-fit:contain}
.original-image img{height:320px}.generated-images{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.image-missing{padding:35px 12px;text-align:center;color:#718096;font-size:12px}
.editor:has(.inspector-title){padding:0;border-radius:8px}
.inspector-title{display:flex;justify-content:space-between;align-items:center;background:#eff2f5;padding:11px 12px;font-weight:700;border-bottom:1px solid #ccd4dc;position:sticky;top:0;z-index:1}
.property-group{border-bottom:1px solid #cfd7df}.property-group summary{background:#e9eef3;padding:8px 10px;font-weight:600;cursor:pointer;font-size:12px}
.property-group summary span{float:right;color:#718096}.property-table{table-layout:fixed;white-space:normal}
.property-table th,.property-table td{padding:7px 10px;font-size:12px;border-bottom:1px solid #e6ebf0;vertical-align:top;overflow-wrap:anywhere}
.property-table th{width:42%;background:#f8fafc;color:#526170;font-weight:400;border-right:1px solid #e1e7ed}
.property-table td{background:white;color:#172c3d}
.material-property strong{display:block;padding:9px 10px 6px;font-size:12px;color:#0f766e;background:#f1f8f7}
.property-empty{padding:12px;color:#718096}
@media(min-width:1450px){.layout{grid-template-columns:255px minmax(400px,1fr) 390px}}
@media(max-width:950px){.layout{grid-template-columns:210px minmax(0,1fr)}.editor{grid-column:2;height:auto;max-height:65vh}.gallery{height:auto}.sidebar{grid-row:1 / span 2;height:calc(100vh - 105px);position:sticky;top:12px}.original-image img{height:280px}.generated-images img{height:170px}}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{grid-row:auto;position:static;height:210px}.editor{grid-column:auto;max-height:none;height:auto}.gallery{height:auto}.generated-images{grid-template-columns:1fr 1fr}.generated-images img{height:140px}}


.property-table input{width:100%;min-width:0;border:1px solid #dce3e9;border-radius:3px;padding:5px 6px;font-weight:400}
.property-text{padding:8px}.property-text textarea{box-sizing:border-box;width:100%;resize:vertical;font:inherit;line-height:1.6;border:1px solid #dce3e9;border-radius:4px;padding:8px}
.property-text textarea:focus,.property-table input:focus{outline:1px solid #0aa3a6}
.inspector-title{gap:8px;font-weight:400}.inspector-title button{padding:5px 12px;font-weight:400}
.property-group summary,.material-property strong{font-weight:400}.property-hint{padding:10px;color:#718096;font-size:11px}
body,body *{font-weight:400!important}header:has(#newBtn[hidden]){display:none}.sidebar,.gallery,.editor{height:calc(100vh - 28px)}
.photo-manager{margin-top:18px}.photo-manager summary{cursor:pointer}.photo-upload{display:inline-flex;flex-direction:column;gap:6px;font-size:12px;margin:8px 0}.photo-upload input{max-width:210px}.photo-assets{display:grid;gap:10px;margin-top:12px}.photo-asset{display:flex;gap:12px;padding:10px;border:1px solid #e2e8f0;border-radius:6px}.photo-asset>img{width:95px;height:95px;object-fit:contain}.photo-asset>div{min-width:0}.photo-asset label{font-size:12px}.photo-asset input[type=checkbox]{width:auto}.photo-asset button{padding:5px 10px}
.sidebar{display:flex;flex-direction:column;overflow:hidden;padding:10px}.list-toolbar{flex:none;background:white;padding-bottom:8px;border-bottom:1px solid #e2e8f0}.list-toolbar select{width:100%;margin-bottom:6px}.filter-footer{display:flex;align-items:center;gap:5px;justify-content:space-between}.filter-footer button{padding:4px;white-space:nowrap;font-size:11px}#products{overflow:auto;min-height:0;flex:1;padding-top:8px}.product-row{margin-bottom:5px;border-bottom:1px solid #edf1f5;padding-bottom:5px}.product span{min-width:0}.product-id{display:block;overflow-wrap:anywhere;user-select:text}.review-check{display:flex;align-items:center;gap:5px;font-size:11px;color:#0f766e;padding:3px 8px}.search{margin-bottom:6px}
</style></head><body>
<header><div class="row"><input id="batch" type="file" multiple accept="image/*" hidden><button id="batchBtn" hidden>Thêm nhiều ảnh</button><button id="newBtn" hidden class="primary">+ Sản phẩm</button></div></header>
<div id="status" class="status" role="alert"></div>
<div id="access"><p>Vui lòng đăng nhập tài khoản admin thư viện để quản lý sản phẩm.</p><a href="/login.html" target="_blank">Đăng nhập</a> <button id="retry">Tải lại</button></div>
<div class="layout" id="layout"><aside class="sidebar"><div class="list-toolbar"><input id="search" class="search" type="search" placeholder="Tìm nhanh tên, ID, nhóm…"><select id="categoryFilter" aria-label="Lọc nhóm"><option value="">Tất cả nhóm</option></select><select id="reviewFilter" aria-label="Lọc kiểm tra"><option value="">Tất cả trạng thái kiểm tra</option><option value="unchecked">Chưa kiểm tra</option><option value="checked">Đã kiểm tra</option></select><select id="photoFilter" aria-label="Lọc ảnh"><option value="">Tất cả ảnh gallery</option><option value="no">Chưa có ảnh gallery</option><option value="yes">Đã có ảnh gallery</option></select><div class="filter-footer"><small id="resultCount" aria-live="polite"></small><button id="clearFilters" type="button">Xóa lọc</button></div></div><div id="products"></div></aside><section class="gallery" id="gallery"><div class="empty">Chọn sản phẩm để xem hình mẫu</div></section><main class="editor" id="editor"><div class="empty">Chọn sản phẩm</div></main></div>
<dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="row confirm-actions"><button id="confirmCancel">Kiểm tra lại</button><button class="primary" id="confirmOk">Xác nhận</button></div></dialog>
<script src="/static/product-formulas-admin.js?v=20261103-quick-review"></script>
</body></html>
